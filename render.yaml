services:
  - type: web
    name: shopsathi-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./shopsathi.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SHOP_SATHI_API_KEY
        sync: false
